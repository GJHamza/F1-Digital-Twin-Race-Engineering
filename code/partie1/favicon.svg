  <path d="M 12 36 L 22 36 L 26 24 L 40 24 L 44 36 L 52 36 C 55 36 56 38 54 40 L 48 44 C 46 45 42 45 38 45 L 26 45 C 22 45 18 45 16 44 L 10 40 C 8 38 9 36 12 36 Z" fill="url(#f1Grad)"/>
  <!-- Rear Wing Blade -->
  <rect x="6" y="22" width="12" height="4" rx="1" fill="#00edff"/>
  <!-- Front Wing & Rear Endplates -->
  <rect x="8" y="38" width="6" height="6" rx="1" fill="#00edff"/>
  <rect x="50" y="38" width="6" height="6" rx="1" fill="#ff2800"/>
  <!-- Wheels -->
  <circle cx="18" cy="44" r="7" fill="#1e293b" stroke="#00edff" stroke-width="2.5"/>
  <circle cx="46" cy="44" r="7" fill="#1e293b" stroke="#ff2800" stroke-width="2.5"/>
  <circle cx="18" cy="44" r="2.5" fill="#ffffff"/>
  <circle cx="46" cy="44" r="2.5" fill="#ffffff"/>
  <!-- Speed Lines -->
  <path d="M 8 16 L 24 16" stroke="#00edff" stroke-width="3" stroke-linecap="round"/>
  <path d="M 14 10 L 34 10" stroke="#0072ff" stroke-width="3" stroke-linecap="round"/>
  <defs>
    <linearGradient id="f1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00edff"/>
      <stop offset="50%" stop-color="#0072ff"/>
      <stop offset="100%" stop-color="#ff2800"/>

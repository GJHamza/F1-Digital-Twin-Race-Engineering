name: F1 Digital Twin — Continuous Integration (CI)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run PyTest Test Baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Full PyTest Suite
        run: |
          python -m pytest --ignore=code/partie4/node_modules

  build-frontend:
    name: Build React Cockpit Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies & Build
        run: |
          cd code/partie4
          npm ci
          npm run build

  docker-build-check:
    name: Validate Docker Image Builds
    runs-on: ubuntu-latest
    needs: [test, build-frontend]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Dockerfile.api Build
        run: docker build -f Dockerfile.api -t f1-flask-api:ci .

      - name: Validate Dockerfile.dashboard Build
        run: docker build -f Dockerfile.dashboard -t f1-streamlit-dashboard:ci .

      - name: Validate Dockerfile.ml_bridge Build
        run: docker build -f Dockerfile.ml_bridge -t f1-ml-bridge:ci .

      - name: Validate Dockerfile.data_engine Build
        run: docker build -f Dockerfile.data_engine -t f1-data-engine:ci .

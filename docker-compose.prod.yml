services:
  # ------------------------------------------------------------
  # Infrastructure Services
  # ------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: f1-zookeeper-prod
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - f1-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: f1-kafka-prod
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - f1-net

  minio:
    image: quay.io/minio/minio:latest
    container_name: f1-minio-prod
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-prod-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - f1-net

  # ------------------------------------------------------------
  # Application Services (G.5.3 Containerization)
  # ------------------------------------------------------------
  flask-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: f1-flask-api
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: production
      FLASK_DEBUG: "false"
      HOST: 0.0.0.0
      PORT: 5000
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MONGO_URI: ${MONGO_URI:-mongodb://localhost:27017}
    networks:
      - f1-net

  streamlit-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: f1-streamlit-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    networks:
      - f1-net

  ml-bridge:
    build:
      context: .
      dockerfile: Dockerfile.ml_bridge
    container_name: f1-ml-bridge
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: f1_telemetry
      KAFKA_ML_SIGNALS_TOPIC: f1_ml_signals
    networks:
      - f1-net

  data-engine:
    build:
      context: .
      dockerfile: Dockerfile.data_engine
    container_name: f1-data-engine
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      KAFKA_BROKER: kafka:29092
      MONGO_URI: ${MONGO_URI:-mongodb://localhost:27017}
    networks:
      - f1-net

networks:
  f1-net:
    driver: bridge

volumes:
  minio-prod-data:
    driver: local
